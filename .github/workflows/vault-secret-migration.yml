name: Archive existing secrets in Vault
on:
  push:
    branches: [vault-secret-migration-20260907]
permissions:
  contents: read
jobs:
  archive_repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Archive and verify encrypted values
        env:
          THECODEORIGIN_VAULT_TOKEN: ${{ secrets.THECODEORIGIN_VAULT_TOKEN }}
          VAULT_PROJECT: habicron-library
          VAULT_ENVIRONMENT: github-legacy
          MIGRATION_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          cat > "$RUNNER_TEMP/archive.mjs" <<'NODE'
          import { setTimeout as delay } from 'node:timers/promises'
          import { pathToFileURL } from 'node:url'
          
          const ORIGIN = 'https://vault.thecodeorigin.com'
          const ORGANIZATION = 'thecodeorigin-co-ltd'
          const ENVIRONMENT = 'github-legacy'
          const ENVIRONMENTS = new Set([ENVIRONMENT, 'github-preview-legacy', 'github-production-legacy'])
          const KEY = /^[A-Z_][A-Z0-9_]{0,127}$/
          const UUID = /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i
          const OMIT = new Set(['THECODEORIGIN_VAULT_TOKEN', 'GITHUB_TOKEN'])
          const MAX_BYTES = 2_097_152
          
          function record(value) {
            return value !== null && typeof value === 'object' && !Array.isArray(value)
          }
          
          function validValue(value) {
            return typeof value === 'string' && Buffer.byteLength(value) <= 65_536
          }
          
          function parseSecrets(raw) {
            let values
            try {
              if (typeof raw !== 'string' || Buffer.byteLength(raw) > 16_777_216) throw new Error()
              values = JSON.parse(raw)
            }
            catch { throw new Error('Migration secrets must be a bounded JSON object') }
            if (!record(values)) throw new Error('Migration secrets must be a JSON object')
            const desired = new Map()
            let skipped = 0
            let bytes = 0
            for (const [name, value] of Object.entries(values)) {
              if (OMIT.has(name.toUpperCase())) { skipped += 1; continue }
              const archiveKey = `GH_${name}`
              if (!KEY.test(name) || !KEY.test(archiveKey) || !validValue(value)) throw new Error('Migration contains an invalid secret name or value')
              desired.set(archiveKey, value)
              bytes += Buffer.byteLength(value)
            }
            if (desired.size > 500 || bytes > MAX_BYTES) throw new Error('Migration exceeds Vault environment limits')
            return { desired: new Map(Array.from(desired).sort(([left], [right]) => left.localeCompare(right))), skipped }
          }
          
          function validateScope(body, scope, pinned) {
            if (!record(body) || body.organizationSlug !== scope.organizationSlug || body.projectSlug !== scope.projectSlug
              || body.environmentSlug !== scope.environmentSlug || typeof body.organizationId !== 'string' || !body.organizationId
              || !UUID.test(body.projectId) || !UUID.test(body.environmentId) || !Number.isSafeInteger(body.revision + 1) || body.revision < 1) {
              throw new Error('Vault returned an invalid archive scope')
            }
            if (pinned && (body.organizationId !== pinned.organizationId || body.projectId !== pinned.projectId
              || body.environmentId !== pinned.environmentId || body.revision < pinned.revision)) {
              throw new Error('Vault archive identity or revision changed unexpectedly')
            }
            return body
          }
          
          /** Migrates values only through Vault's authenticated, create-only integration service. */
          export async function archiveVaultSecrets(input, options = {}) {
            if (typeof input?.token !== 'string' || !/^tco_vlt_[A-Za-z0-9_-]{1,120}$/.test(input.token)) throw new Error('A valid Vault migration token is required')
            if (typeof input.project !== 'string' || input.project.length > 128 || !/^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$/.test(input.project)) throw new Error('A fixed Vault project slug is required')
            const environment = input.environment ?? ENVIRONMENT
            if (!ENVIRONMENTS.has(environment)) throw new Error('Migration must target an approved GitHub archive environment')
            const { desired, skipped } = parseSecrets(input.secretsJson)
            const fetcher = options.fetch ?? fetch
            const sleep = options.sleep ?? delay
            const scope = { organizationSlug: ORGANIZATION, projectSlug: input.project, environmentSlug: environment }
          
            async function discard(response) {
              try { await response.body?.cancel() }
              catch { /* Error response bodies are deliberately ignored. */ }
            }
          
            async function request(operation, body) {
              for (let attempt = 0; attempt < 4; attempt += 1) {
                let response
                try {
                  response = await fetcher(`${ORIGIN}/api/integration/secrets/${operation}`, {
                    method: 'POST', redirect: 'error', signal: AbortSignal.timeout(30_000),
                    headers: { Authorization: `Bearer ${input.token}`, 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify(body),
                  })
                }
                catch { throw new Error(`Vault archive ${operation} request failed`) }
                if (response.status === 429 && attempt < 3) {
                  const seconds = Number(response.headers.get('Retry-After'))
                  const wait = Number.isFinite(seconds) && seconds > 0 ? Math.min(seconds * 1000, 30_000) : 250 * (2 ** attempt)
                  await discard(response)
                  await sleep(wait)
                  continue
                }
                if (response.status === 409) {
                  await discard(response)
                  return { conflict: true }
                }
                const expectedStatus = operation === 'create' ? 201 : 200
                if (response.status !== expectedStatus) {
                  await discard(response)
                  throw new Error(`Vault archive ${operation} failed (HTTP ${response.status})`)
                }
                try {
                  const text = await response.text()
                  if (Buffer.byteLength(text) > 16_777_216) throw new Error()
                  return { value: JSON.parse(text) }
                }
                catch { throw new Error('Vault returned an invalid archive response') }
              }
              throw new Error('Vault archive rate limit did not clear')
            }
          
            async function snapshot(pinned) {
              const result = await request('export', scope)
              if (result.conflict) throw new Error('Vault archive export conflicted; retry the migration')
              const body = validateScope(result.value, scope, pinned)
              if (!record(body.secrets) || Object.entries(body.secrets).some(([key, value]) => !KEY.test(key) || !validValue(value)))
                throw new Error('Vault returned an invalid archive secret map')
              const secrets = new Map(Object.entries(body.secrets))
              for (const [key, value] of desired) {
                if (secrets.has(key) && secrets.get(key) !== value) throw new Error('An archived secret differs; overwrite is refused')
              }
              const combined = new Map(secrets)
              for (const [key, value] of desired) combined.set(key, value)
              if (combined.size > 500 || Array.from(combined.values()).reduce((total, value) => total + Buffer.byteLength(value), 0) > MAX_BYTES)
                throw new Error('Migration exceeds available Vault environment capacity')
              return { organizationId: body.organizationId, projectId: body.projectId, environmentId: body.environmentId, revision: body.revision, secrets }
            }
          
            let current = await snapshot()
            let archived = 0
            let unchanged = 0
            for (const [key, value] of desired) {
              let finished = false
              for (let attempt = 0; attempt < 4; attempt += 1) {
                if (current.secrets.has(key)) { unchanged += 1; finished = true; break }
                const result = await request('create', Object.assign({}, scope, { key, value, expectedRevision: current.revision }))
                if (result.conflict) { current = await snapshot(current); continue }
                const created = validateScope(result.value, scope, current)
                if (created.created !== true || created.revision !== current.revision + 1)
                  throw new Error('Vault returned an invalid create acknowledgement')
                current.revision = created.revision
                current.secrets.set(key, value)
                archived += 1
                finished = true
                break
              }
              if (!finished) throw new Error('Vault archive changed repeatedly; retry the migration')
            }
            const verified = await snapshot(current)
            if (Array.from(desired).some(([key, value]) => verified.secrets.get(key) !== value))
              throw new Error('Vault archive verification failed')
            return { project: input.project, environment, archived, unchanged, skipped, verified: true }
          }
          
          if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {
            archiveVaultSecrets({
              token: process.env.THECODEORIGIN_VAULT_TOKEN,
              project: process.env.VAULT_PROJECT,
              environment: process.env.VAULT_ENVIRONMENT,
              secretsJson: process.env.MIGRATION_SECRETS_JSON,
            }).then(result => console.log(JSON.stringify(result))).catch(() => {
              // Never print fetched bodies, transport errors, or values supplied through GitHub contexts.
              console.error('Vault secret archive failed; no existing values were overwritten.')
              process.exitCode = 1
            })
          }
          
          NODE
          node "$RUNNER_TEMP/archive.mjs"

name: Deploy landing page

# Deploys public/ to Cloudflare Workers (static assets) on
# https://habit.thecodeorigin.com whenever the landing page changes on main.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - wrangler.toml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Only one landing-page deploy at a time; newer pushes supersede older runs.
concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load Cloudflare credentials from Vault
        uses: thecodeorigin/actions/vault-environment@4bff26b9e9ac41c293f82a294a5eb2a262648a87
        with:
          token: ${{ secrets.THECODEORIGIN_VAULT_TOKEN }}
          project: habicron-library
          environment: production
          deployment-kind: production
          keys: '["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"]'

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm
        env:
          GITHUB_TOKEN: ${{ github.token }}
